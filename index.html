<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickTranslate</title>
    <!-- Dependencies -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
            background: var(--bg);
        }

        .screen.active {
            display: flex;
        }

        /* Onboarding Screen */
        #onboardingScreen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), #c084fc);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-card {
            width: 100%;
            max-width: 360px;
            padding: 32px;
            border-radius: 24px;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        /* Home Screen (Contact List) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .contact-list {
            flex-grow: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 20px;
        }

        .contact-card {
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .contact-card:hover {
            transform: scale(1.02);
            border-color: var(--primary);
        }

        .contact-avatar {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .contact-name {
            font-weight: 600;
            font-size: 1rem;
        }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .overlay.active {
            display: flex;
        }

        .pulse-ring {
            width: 120px;
            height: 120px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
        }

        .pulse-ring::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse-out 2s infinite;
            z-index: -1;
        }

        @keyframes pulse-out {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        .call-actions {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 300px;
            margin-top: 60px;
        }

        .btn-round {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            color: white;
        }

        .btn-round:active {
            transform: scale(0.9);
        }

        .btn-success {
            background: var(--success);
        }

        .btn-danger {
            background: var(--danger);
        }

        /* Conversation View */
        #conversationScreen {
            padding: 0;
        }

        .chat-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 16px;
            border-radius: 20px;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.mine {
            align-self: flex-end;
            background: var(--primary);
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;
            background: var(--card-bg);
            border-bottom-left-radius: 4px;
        }

        .message-orig {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
        }

        .message-trans {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .ptt-container {
            padding: 24px 24px 40px;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .ptt-btn {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ptt-btn.recording {
            transform: scale(1.2);
            background: var(--danger);
            animation: recording-pulse 1.5s infinite;
        }

        @keyframes recording-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .lang-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            width: 100%;
            justify-content: center;
            scrollbar-width: none;
        }

        .lang-bar::-webkit-scrollbar {
            display: none;
        }

        .lang-chip {
            padding: 8px 16px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .lang-chip.active {
            background: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>

<body>

    <!-- Onboarding -->
    <div id="onboardingScreen" class="screen active">
        <div class="logo-container">
            <div class="logo-icon"><i data-lucide="languages" style="width: 40px; height: 40px; color: white;"></i>
            </div>
            <h1>QuickTranslate</h1>
            <p style="color: var(--text-muted); margin-top: 12px;">P2P Voice-to-Voice Conversation</p>
        </div>
        <div class="glass input-card">
            <p style="text-align: left; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted);">Your Phone
                Number</p>
            <input type="tel" id="myPhoneInput" placeholder="e.g. 5551234567">
            <button class="btn btn-primary" onclick="setupIdentity()">Start Translating</button>
        </div>
    </div>

    <!-- Home Screen -->
    <div id="homeScreen" class="screen">
        <div class="header">
            <div>
                <h2 style="margin: 0;">Friends</h2>
                <p id="myNumberLabel" style="margin: 4px 0 0 0; font-size: 0.8rem; color: var(--text-muted);"></p>
            </div>
            <button class="glass"
                style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);"
                onclick="openAddContact()">
                <i data-lucide="plus"></i>
            </button>
        </div>

        <div id="contactList" class="contact-list">
            <!-- Contacts -->
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="glass"
                style="padding: 10px 20px; border-radius: 12px; color: var(--text-muted); cursor: pointer;"
                onclick="resetApp()">Settings / Reset</button>
        </div>
    </div>

    <!-- Outgoing Call Overlay -->
    <div id="outgoingOverlay" class="overlay">
        <div class="pulse-ring"><i data-lucide="phone-outgoing" style="width: 48px; height: 48px;"></i></div>
        <h2 id="callingName">Calling...</h2>
        <p style="color: var(--text-muted);">Waiting for answer</p>
        <div class="call-actions">
            <button class="btn-round btn-danger" onclick="cancelCall()" style="margin: 0 auto;"><i
                    data-lucide="phone-off"></i></button>
        </div>
    </div>

    <!-- Incoming Call Overlay -->
    <div id="incomingOverlay" class="overlay">
        <div class="pulse-ring"><i data-lucide="phone-incoming" style="width: 48px; height: 48px;"></i></div>
        <h2 id="incomingName">Incoming Call</h2>
        <p style="color: var(--text-muted);">Wants to translate with you</p>
        <div class="call-actions">
            <button class="btn-round btn-danger" onclick="declineCall()"><i data-lucide="phone-off"></i></button>
            <button class="btn-round btn-success" onclick="acceptCall()"><i data-lucide="phone"></i></button>
        </div>
    </div>

    <!-- Conversation Screen -->
    <div id="conversationScreen" class="screen">
        <div class="chat-header">
            <button class="glass"
                style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);"
                onclick="endCall()">
                <i data-lucide="chevron-left"></i>
            </button>
            <div>
                <h3 id="activeChatName" style="margin: 0;">Friend Name</h3>
                <div id="connectionStatus"
                    style="display: flex; align-items: center; gap: 4px; color: var(--success); font-size: 0.75rem;">
                    <span style="width: 6px; height: 6px; background: currentColor; border-radius: 50%;"></span>
                    Connected
                </div>
            </div>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <div class="ptt-container">
            <div class="lang-bar" id="myLangBar">
                <!-- Lang chips -->
            </div>

            <button id="pttBtn" class="ptt-btn">
                <i data-lucide="mic" style="width: 32px; height: 32px;"></i>
            </button>
            <div id="pttStatus" class="status-text">Hold to speak</div>
        </div>
    </div>

    <script>
        // --- Configuration & State ---
        const LANGUAGES = [
            { code: 'en', name: 'English', voice: 'en-US' },
            { code: 'es', name: 'Spanish', voice: 'es-ES' },
            { code: 'fr', name: 'French', voice: 'fr-FR' },
            { code: 'de', name: 'German', voice: 'de-DE' },
            { code: 'it', name: 'Italian', voice: 'it-IT' },
            { code: 'ja', name: 'Japanese', voice: 'ja-JP' },
            { code: 'ko', name: 'Korean', voice: 'ko-KR' }
        ];

        let peer = null;
        let connection = null;
        let myNumber = localStorage.getItem('qt_myNumber');
        let myLang = localStorage.getItem('qt_myLang') || 'en';
        let contacts = JSON.parse(localStorage.getItem('quickContacts') || '[]');

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (myNumber) {
                initPeer();
                showScreen('homeScreen');
                renderContacts();
            } else {
                showScreen('onboardingScreen');
            }
            renderLangBar();
        });

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- Identity & Peer ---
        async function setupIdentity() {
            const input = document.getElementById('myPhoneInput').value.trim();
            if (!input) return alert("Please enter your number");

            // Permission Primer: Requests mic access immediately to avoid stutters later
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                console.warn("Microphone permission denied or not supported:", e);
                alert("This app requires microphone access to work. Please allow it and try again.");
                return;
            }

            myNumber = input.replace(/\D/g, '');
            localStorage.setItem('qt_myNumber', myNumber);
            initPeer();
            showScreen('homeScreen');
            renderContacts();
        }

        function initPeer() {
            const peerId = `qt-${myNumber}`;
            peer = new Peer(peerId);

            peer.on('open', id => {
                document.getElementById('myNumberLabel').innerText = `My ID: ${myNumber}`;
            });

            peer.on('connection', conn => {
                connection = conn;
                document.getElementById('incomingName').innerText = conn.metadata?.from || "Unknown";
                document.getElementById('incomingOverlay').classList.add('active');

                conn.on('close', () => {
                    document.getElementById('incomingOverlay').classList.remove('active');
                });
            });

            peer.on('error', err => {
                if (err.type === 'peer-unavailable') {
                    alert("Friend is not online or hasn't started the app.");
                    cancelCall();
                }
            });
        }

        // --- Call Flow ---
        function startCall(contact) {
            document.getElementById('callingName').innerText = contact.name;
            document.getElementById('outgoingOverlay').classList.add('active');

            const targetId = `qt-${contact.number}`;
            connection = peer.connect(targetId, {
                metadata: { from: myNumber, fromLang: myLang }
            });

            setupConnectionHandlers(connection);
        }

        function acceptCall() {
            document.getElementById('incomingOverlay').classList.remove('active');
            setupConnectionHandlers(connection);
            connection.send({ type: 'handshake-accept', lang: myLang });
            enterConversation(connection.metadata?.from || "Friend");
        }

        function cancelCall() {
            if (connection) connection.close();
            document.getElementById('outgoingOverlay').classList.remove('active');
        }

        function declineCall() {
            if (connection) connection.close();
            document.getElementById('incomingOverlay').classList.remove('active');
        }

        function endCall() {
            if (connection) connection.close();
            showScreen('homeScreen');
            document.getElementById('chatMessages').innerHTML = '';
        }

        function setupConnectionHandlers(conn) {
            conn.on('data', data => {
                if (data.type === 'handshake-accept') {
                    document.getElementById('outgoingOverlay').classList.remove('active');
                    enterConversation(conn.metadata?.from || "Friend");
                } else if (data.type === 'voice-msg') {
                    handleIncomingVoice(data);
                }
            });

            conn.on('close', () => {
                showScreen('homeScreen');
                alert("Call ended");
            });
        }

        function enterConversation(name) {
            document.getElementById('activeChatName').innerText = name;
            showScreen('conversationScreen');
        }

        // --- Voice & Translation ---
        const speechRec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        speechRec.interimResults = false;
        speechRec.continuous = false;

        const pttBtn = document.getElementById('pttBtn');
        let isListening = false;
        let isActuallyRecording = false;

        const startListening = () => {
            if (isListening) return;
            isListening = true;
            document.getElementById('pttStatus').innerText = "Starting mic...";

            try {
                speechRec.lang = LANGUAGES.find(l => l.code === myLang).voice;
                speechRec.start();
            } catch (e) {
                console.error("Speech start failed", e);
                resetPTT();
            }
        };

        const stopListening = () => {
            if (!isListening) return;
            // We don't set isListening = false here; we wait for onend
            speechRec.stop();
            document.getElementById('pttStatus').innerText = "Processing...";
        };

        function resetPTT() {
            isListening = false;
            isActuallyRecording = false;
            pttBtn.classList.remove('recording');
            document.getElementById('pttStatus').innerText = "Hold to speak";
        }

        // --- Event Listeners (Restored) ---
        pttBtn.addEventListener('mousedown', startListening);
        pttBtn.addEventListener('mouseup', stopListening);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startListening(); });
        pttBtn.addEventListener('touchend', stopListening);

        speechRec.onstart = () => {
            isActuallyRecording = true;
            pttBtn.classList.add('recording');
            document.getElementById('pttStatus').innerText = "Listening...";
        };

        speechRec.onend = () => {
            resetPTT();
        };

        speechRec.onresult = async (e) => {
            const transcript = e.results[0][0].transcript;
            if (transcript) {
                addMessage(transcript, 'mine');
                if (connection && connection.open) {
                    connection.send({
                        type: 'voice-msg',
                        text: transcript,
                        fromLang: myLang
                    });
                }
            }
        };

        speechRec.onerror = (e) => {
            console.error("Speech Error:", e.error);
            resetPTT();
            if (e.error === 'not-allowed') {
                alert("Microphone permission was denied. Please check your browser settings.");
            }
        };

        async function handleIncomingVoice(data) {
            // Translate to my language
            const translated = await translate(data.text, data.fromLang, myLang);
            addMessage(translated, 'theirs', data.text);

            // Speak it
            const utterance = new SpeechSynthesisUtterance(translated);
            utterance.lang = LANGUAGES.find(l => l.code === myLang).voice;
            window.speechSynthesis.speak(utterance);
        }

        async function translate(text, from, to) {
            if (from === to) return text;
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
                const json = await res.json();
                return json.responseData.translatedText;
            } catch (e) {
                return text;
            }
        }

        // --- UI Helpers ---
        function renderContacts() {
            const list = document.getElementById('contactList');
            list.innerHTML = '';
            contacts.forEach(c => {
                const card = document.createElement('div');
                card.className = 'glass contact-card';
                card.onclick = () => startCall(c);
                card.innerHTML = `
                    <div class="contact-avatar">👤</div>
                    <div class="contact-name">${c.name}</div>
                    <div style="font-size: 0.7rem; color: var(--text-muted);">${c.number}</div>
                `;
                list.appendChild(card);
            });
        }

        function openAddContact() {
            const name = prompt("Friend's Name:");
            const num = prompt("Friend's Number:");
            if (name && num) {
                contacts.push({ name, number: num.replace(/\D/g, '') });
                localStorage.setItem('quickContacts', JSON.stringify(contacts));
                renderContacts();
            }
        }

        function renderLangBar() {
            const bar = document.getElementById('myLangBar');
            bar.innerHTML = '';
            LANGUAGES.forEach(l => {
                const chip = document.createElement('div');
                chip.className = `lang-chip ${l.code === myLang ? 'active' : ''}`;
                chip.innerText = l.name;
                chip.onclick = () => {
                    myLang = l.code;
                    localStorage.setItem('qt_myLang', myLang);
                    renderLangBar();
                };
                bar.appendChild(chip);
            });
        }

        function addMessage(text, type, orig = null) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                ${orig ? `<div class="message-orig">${orig}</div>` : ''}
                <div class="message-trans">${text}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function resetApp() {
            if (confirm("Wipe all data?")) { localStorage.clear(); location.reload(); }
        }
    </script>
</body>

</html>
